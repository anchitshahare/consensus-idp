<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConsensusIDP — Enterprise Document Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-slate-50 font-sans flex flex-col min-h-screen">
    <!-- Disclaimer Banner -->
    <div
      id="disclaimer-banner"
      class="bg-amber-50 border-b border-amber-200 px-4 py-1.5 text-center text-xs text-amber-800 flex items-center justify-center gap-2 flex-shrink-0"
    >
      <svg
        class="w-3.5 h-3.5 text-amber-500 flex-shrink-0"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          fill-rule="evenodd"
          d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
          clip-rule="evenodd"
        />
      </svg>
      <span
        ><strong>Portfolio Demo.</strong> Preloaded recorded model outputs from
        Claude Sonnet 4.5 &amp; GPT-4o. Zero live inference. Zero private
        infrastructure. Clean-room sandbox implementation.</span
      >
    </div>

    <!-- App Header -->
    <header class="bg-white border-b border-slate-200 flex-shrink-0 z-30">
      <!-- Brand row -->
      <div class="px-6 pt-3.5 pb-0 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div
            class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center flex-shrink-0"
          >
            <svg
              class="w-4 h-4 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              />
            </svg>
          </div>
          <div>
            <div class="text-sm font-bold text-slate-900 leading-none">
              ConsensusIDP
            </div>
            <div
              class="text-[10px] text-slate-400 font-medium mt-0.5 tracking-wide uppercase"
            >
              Enterprise Document Intelligence
            </div>
          </div>
        </div>

        <!-- Reset -->
        <button
          id="btn-reset"
          class="hidden items-center gap-1.5 text-xs text-slate-400 hover:text-slate-700 transition-colors px-2 py-1 rounded hover:bg-slate-100"
          onclick="window.app.reset()"
        >
          <svg
            class="w-3.5 h-3.5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
            />
          </svg>
          Reset demo
        </button>
      </div>

      <!-- Progress Nav -->
      <nav id="progress-nav" class="px-6 pb-0 overflow-x-auto">
        <!-- Rendered by router.js -->
      </nav>
    </header>

    <!-- Screen Container -->
    <main id="screen-container" class="flex-1 overflow-auto">
      <!-- Each screen renders here -->
      <div
        class="flex items-center justify-center h-full text-slate-400 text-sm"
      >
        Loading…
      </div>
    </main>

    <!-- Scripts — order matters -->
    <script src="js/mockData.js"></script>
    <script src="js/state.js"></script>
    <script src="js/router.js"></script>
    <script src="js/screens/s1-workspace.js"></script>
    <script src="js/screens/s2-schema.js"></script>
    <script src="js/screens/s3-workflow.js"></script>
    <script src="js/screens/s4-upload.js"></script>
    <script src="js/screens/s5-run.js"></script>
    <script src="js/screens/s6-hitl.js"></script>
    <script src="js/screens/s7-dataset.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
